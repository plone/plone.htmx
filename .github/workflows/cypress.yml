name: Cypress Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache buildout eggs
        uses: actions/cache@v4
        with:
          path: eggs
          key: ubuntu-3.12-plone-6.1-eggs-${{ hashFiles('buildout.cfg') }}
          restore-keys: |
            ubuntu-3.12-plone-6.1-eggs-

      - name: Install buildout
        run: |
          pip install --upgrade pip zc.buildout setuptools
          buildout -Nv

      - name: Create Plone site
        run: |
          bin/instance start
          sleep 20
          curl -s -u admin:admin -X POST http://localhost:8080/@@ploneAddSite \
            -d "site_id=Plone&distribution=classic&submit=Submit" || true
          sleep 5

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          wait-on: "http://localhost:8080/Plone"
          wait-on-timeout: 60
          spec: cypress/integration/edit_title.spec.js
        env:
          CYPRESS_PLONE_HOST: localhost:8080

      - name: Stop Zope
        if: always()
        run: bin/instance stop || true
