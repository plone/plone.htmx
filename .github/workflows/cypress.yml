name: Cypress Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache buildout eggs
        uses: actions/cache@v4
        with:
          path: eggs
          key: ubuntu-3.12-plone-6.1-eggs-${{ hashFiles('buildout.cfg') }}
          restore-keys: |
            ubuntu-3.12-plone-6.1-eggs-

      - name: Install buildout and run it
        run: |
          pip install --upgrade pip "zc.buildout==5.2.0" "setuptools==81.0.0"
          buildout -v

      - name: Start Zope and create Plone site
        run: |
          bin/instance start
          # Wait for Zope to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 && break || sleep 4
          done
          # Create the Plone site
          curl -sf -u admin:admin             "http://localhost:8080/@@ploneAddSite?site_id=Plone&distribution=classic&submit=Submit" ||           curl -sf -u admin:admin -X POST http://localhost:8080/@@ploneAddSite             -d "site_id=Plone&distribution=classic&submit=Submit"
          sleep 3

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          wait-on: "http://localhost:8080/Plone"
          wait-on-timeout: 30
          spec: cypress/integration/edit_title.spec.js
          browser: chrome
        env:
          CYPRESS_PLONE_HOST: localhost:8080

      - name: Stop Zope
        if: always()
        run: bin/instance stop || true
